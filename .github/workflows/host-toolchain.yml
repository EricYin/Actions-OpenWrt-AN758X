name: Host Toolchain Cache (golang / rustc)

# =========================================================
# 独立的 host 工具链缓存构建流程
#
# 目的：只编 host 侧 go(-bootstrap) / golang / rust 并缓存，不编固件。
#       供主流程 build-ponwrt.yml 的步骤 21 命中，省掉每次冷启动
#       那 1.5~2.5 小时的自举时间。
#
# ★ 一个关键事实：host 缓存 key 里只有 TARGET / SUBTARGET，
#   没有机型名：
#     ponwrt-hosttools-airoha-an7581-go<版本>-rs<版本>-<hash>
#   而 ponwrt 的所有机型都落在 airoha/an7581 或 airoha/an7583 两个
#   subtarget 上。所以同一 subtarget 下的机型共享同一份缓存 ——
#   不需要给每个机型各建一份，跑一次 an7581 + 一次 an7583 就够。
#
# 触发：
#   - 手动（workflow_dispatch），选 soc = an7581 / an7583 / both
#   - 每周一自动跑一次，跟上 feed 里 golang / rust 的版本升级
# =========================================================

on:
  workflow_dispatch:
    inputs:
      soc:
        description: 'SoC（决定 subtarget；同 subtarget 的所有机型共享一份缓存）'
        required: true
        default: 'an7581'
        type: choice
        options:
          - an7581
          - an7583
          - both
      source:
        description: '编译源码仓库'
        required: true
        default: 'pbs05/ponwrt'
        type: choice
        options:
          - pbs05/ponwrt
          - fork
      branch:
        description: 'ponwrt 源码分支'
        required: true
        default: 'master'
      force:
        description: '忽略已有 host 缓存，强制重编'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      upload_release:
        description: '额外存一份到 Release（actions/cache 7 天未命中会淘汰，Release 不会）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      reuse_toolchain:
        description: '复用主流程的工具链缓存来拿 host gcc（关 = 现场 make tools/install）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    # 每周一 03:17（UTC）跑一次，给 feed 升版后自动续上缓存
    - cron: '17 3 * * 1'

permissions:
  contents: write

env:
  BUILD_ROOT: /workdir
  REPO_URL: ${{ github.event.inputs.source == 'fork' && 'https://github.com/qwe3017/ponwrt' || 'https://github.com/pbs05/ponwrt' }}
  REPO_BRANCH: ${{ github.event.inputs.branch || 'master' }}
  FEEDS_CONF: ''
  DIY_P1_SH: diy-part1.sh
  USE_DL_CACHE: true
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # ⚠ actions/cache 的 with.path 不接受 GITHUB_ENV 动态值，必须是 workflow 级静态
  HOST_CACHE_DIR: /workdir/hosttool-cache
  HOST_INCLUDE_BUILDDIR: 'false'
  HOST_RELEASE_BACKUP: ${{ github.event.inputs.upload_release == 'false' && 'false' || 'true' }}
  # 用 '== true' 而不是 '|| 默认值'：GitHub 表达式里非空字符串即真，
  # 'false' 不会被判为假；schedule 触发时 inputs 为 null 也要有确定值。
  FORCE_REBUILD: ${{ github.event.inputs.force == 'true' && 'true' || 'false' }}
  REUSE_TOOLCHAIN: ${{ github.event.inputs.reuse_toolchain == 'false' && 'false' || 'true' }}

jobs:
  # =========================================================
  # 0. 展开 SoC → matrix，并预先把 Release 建好
  #
  #    预先建 Release 而不是让 build job 各建一次：
  #    matrix 并行时多个 job 同时 gh release create 会互相冲突。
  # =========================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: matrix
        run: |
          SOC="${{ github.event.inputs.soc || 'an7581' }}"
          case "$SOC" in
            both)   LIST='["an7581","an7583"]' ;;
            an7583) LIST='["an7583"]' ;;
            *)      LIST='["an7581"]' ;;
          esac
          # schedule 触发时 inputs 为 null，默认跑 an7581（机型最多的那个）
          echo "matrix={\"soc\":$LIST}" >> "$GITHUB_OUTPUT"
          echo "SoC 列表: $LIST"

      - name: Ensure hosttool-cache release exists
        if: env.HOST_RELEASE_BACKUP == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view hosttool-cache --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create hosttool-cache --repo "$GITHUB_REPOSITORY" \
              --title "Host Toolchain Cache" \
              --notes "host 侧 go-bootstrap / rustc 缓存，由 host-toolchain.yml 自动生成，请勿手动删除" \
              --latest=false

  # =========================================================
  # 1. 构建 host 工具链
  # =========================================================
  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: 2

    env:
      SOC: ${{ matrix.soc }}
      # 用 all：不裁剪设备、直接用 configs/<soc>.config。
      # host 缓存 key 不随机型变，没必要挑具体机型。
      PROFILE: all
      CONFIG_FILE: configs/${{ matrix.soc }}.config

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # =========================================================
      # 1. 释放空间 + 初始化编译环境
      # =========================================================
      - name: Free disk space & init build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm \
            /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true

          # 8G swap：golang bootstrap 与 rustc 自举都是内存大户
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile && sudo swapon /swapfile

          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq install build-essential clang llvm dwarves \
            libssl-dev libelf-dev bc flex bison python3 python3-distutils \
            xz-utils tar unzip zip zstd dos2unix gettext \
            rsync file wget curl git subversion 2>/dev/null || true

          if [ -x "$GITHUB_WORKSPACE/scripts/init_build_environment.sh" ]; then
            bash "$GITHUB_WORKSPACE/scripts/init_build_environment.sh" || true
          else
            sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)' || true
          fi

          sudo -E apt-get -yqq autoremove --purge
          sudo -E apt-get -yqq clean
          sudo -E timedatectl set-timezone "$TZ"

          sudo mkdir -p /workdir
          sudo chown "$USER":"$USER" /workdir

          echo "磁盘:"; df -hT /workdir
          echo "内存:"; free -h

      # =========================================================
      # 2. 克隆源码
      # =========================================================
      - name: Clone source code
        run: |
          cd "$BUILD_ROOT"
          git clone "$REPO_URL" -b "$REPO_BRANCH" --single-branch --depth=1 openwrt
          ln -sf "$BUILD_ROOT/openwrt" "$GITHUB_WORKSPACE/openwrt"
          cd openwrt && echo "commit: $(git rev-parse --short HEAD)"

      # =========================================================
      # 3. dl 缓存（只恢复，不回写）
      #    go/rust 源码包加起来 100MB+，命中能省不少下载时间。
      #    不回写是为了避免和主流程的 dl 缓存抢同一条 key。
      # =========================================================
      - name: Restore dl cache
        if: env.USE_DL_CACHE == 'true'
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: /workdir/openwrt/dl
          key: ponwrt-dl-$(date +%Y%W)

      # =========================================================
      # 4. feeds
      #    ⚠ 私有仓库（openwrt-fttr）在这里并不需要 —— 树里唯一的
      #      Rust 包 h3c-fttr-tools 来自那里，但编 host rustc 用不上它。
      #      所以本流程不注入任何 PAT，feeds 拉不动也只是少了那几个包。
      # =========================================================
      - name: Update & install feeds
        run: |
          cd "$BUILD_ROOT/openwrt"
          if [ -n "${FEEDS_CONF}" ] && [ -e "$GITHUB_WORKSPACE/${FEEDS_CONF}" ]; then
            cp "$GITHUB_WORKSPACE/${FEEDS_CONF}" feeds.conf.default
          fi
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Pull optional plugins (diy-part1.sh)
        continue-on-error: true
        run: |
          cd "$BUILD_ROOT/openwrt"
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      # =========================================================
      # 5. .config：直接用源码自带的 configs/<soc>.config
      #    不跑 diy-part2.sh —— 它只改时区/固件后缀/内核加密符号，
      #    对 host 侧 golang / rust 包没有任何影响，跳过能少一堆失败点。
      # =========================================================
      - name: Load configuration
        run: |
          cd "$BUILD_ROOT/openwrt"
          if [ -f "configs/${SOC}.config" ]; then
            cp "configs/${SOC}.config" .config
            echo "✅ 使用 configs/${SOC}.config"
          elif [ -e "$GITHUB_WORKSPACE/${CONFIG_FILE}" ]; then
            cp "$GITHUB_WORKSPACE/${CONFIG_FILE}" .config
            echo "✅ 使用仓库内 ${CONFIG_FILE}"
          else
            echo "::error::找不到 ${CONFIG_FILE}"
            exit 1
          fi
          # 全机型：不裁剪设备
          sed -i '/CONFIG_TARGET_DEVICE_/d; /^CONFIG_TARGET_MULTI_PROFILE=/d' .config

      - name: Generate toolchain cache key (for reuse)
        id: tc-key
        run: |
          cd "$BUILD_ROOT/openwrt"
          echo "===== make defconfig ====="
          make defconfig 2>&1 | tail -5

          TARGET=$(grep '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2)
          SUBTARGET=$(grep '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2)
          TOOLS_HASH=$(find tools toolchain -type f \( -name "Makefile" -o -name "*.mk" \) \
            -exec md5sum {} + 2>/dev/null | sort | md5sum | cut -d' ' -f1)
          echo "TC_KEY=ponwrt-toolchain-${TARGET}-${SUBTARGET}-${TOOLS_HASH:0:16}" >> "$GITHUB_OUTPUT"
          echo "TARGET=$TARGET SUBTARGET=$SUBTARGET"

      # =========================================================
      # 6. 拿到 host gcc —— 编 host 包的前置条件
      #
      #    两条路：
      #      a) 复用主流程的工具链缓存（默认，快）
      #      b) 现场 make tools/install
      #
      #    ⚠ 只做 tools/install，不做 toolchain/install：
      #      host 侧的 golang / rust 只用 host gcc（staging_dir/host/bin/gcc），
      #      压根不需要 target 交叉编译器，编 toolchain 白花 30~60 分钟。
      # =========================================================
      - name: Restore toolchain from actions/cache
        id: tc-restore
        if: env.REUSE_TOOLCHAIN == 'true'
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: |
            /workdir/openwrt/staging_dir/host
            /workdir/openwrt/staging_dir/hostpkg
            /workdir/openwrt/staging_dir/toolchain
          key: ${{ steps.tc-key.outputs.TC_KEY }}
          # 前缀必须带 board：key 实际是 ponwrt-toolchain-airoha-<subtarget>-<hash>
          restore-keys: |
            ponwrt-toolchain-airoha-${{ matrix.soc }}-

      - name: Install host tools
        if: env.REUSE_TOOLCHAIN != 'true' || steps.tc-restore.outputs.cache-hit != 'true'
        run: |
          cd "$BUILD_ROOT/openwrt"
          # 源码先到位：make tools/install 不会自动补下载
          make tools/download -j"$(nproc)" V=s || echo "::warning::tools/download 有告警"
          make tools/install -j"$(nproc)" || make tools/install -j1 V=s || {
            echo "::error::tools 编译失败，host 工具链无法进行"
            exit 1
          }
          touch tools/stamp-compile 2>/dev/null || true

      - name: Verify host gcc
        run: |
          cd "$BUILD_ROOT/openwrt"
          if [ ! -x staging_dir/host/bin/gcc ]; then
            echo "::error::staging_dir/host/bin/gcc 不存在，无法编译 host 包"
            exit 1
          fi
          staging_dir/host/bin/gcc --version | head -1

      # =========================================================
      # 7. host 工具链缓存 key
      # =========================================================
      - name: Generate host toolchain cache key
        id: host-key
        run: |
          cd "$BUILD_ROOT/openwrt"
          SCRIPT="$GITHUB_WORKSPACE/scripts/host-toolchain.sh"
          if [ ! -f "$SCRIPT" ]; then
            echo "::error::缺 $SCRIPT —— 请确认脚本已入仓"
            exit 1
          fi
          dos2unix "$SCRIPT" 2>/dev/null || true
          chmod +x "$SCRIPT"
          HOST_INCLUDE_BUILDDIR="$HOST_INCLUDE_BUILDDIR" \
            bash "$SCRIPT" key "$BUILD_ROOT/openwrt"

      # =========================================================
      # 8. 恢复已有 host 缓存（force=true 时跳过）
      # =========================================================
      - name: Restore host toolchain from actions/cache
        id: host-restore
        if: env.FORCE_REBUILD != 'true'
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: /workdir/hosttool-cache
          # ⚠ 故意不设 restore-keys。key 里含 go/rust 版本与包 Makefile 的
          #   md5，前缀回退会命中「版本已经变了」的旧缓存，等于拿错版本的
          #   rustc 去编包。版本不符就该重编，不做模糊匹配。
          key: ${{ steps.host-key.outputs.HOST_CACHE_KEY }}

      - name: Restore host toolchain from Release backup
        id: host-release-restore
        if: >-
          env.FORCE_REBUILD != 'true'
          && env.HOST_RELEASE_BACKUP == 'true'
          && steps.host-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$BUILD_ROOT/openwrt"
          KEY='${{ steps.host-key.outputs.HOST_CACHE_KEY }}'
          mkdir -p "$HOST_CACHE_DIR"
          ASSET="${KEY}.tzst"
          if gh release view hosttool-cache --repo "$GITHUB_REPOSITORY" \
               --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$ASSET"; then
            gh release download hosttool-cache --repo "$GITHUB_REPOSITORY" -p "$ASSET" -D "$HOST_CACHE_DIR"
            echo "restored=true" >> "$GITHUB_OUTPUT"
            echo "✅ 已从 Release 下载 $ASSET"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "Release 中没有 $ASSET"
          fi

      - name: Unpack host toolchain
        id: host-unpack
        if: env.FORCE_REBUILD != 'true'
        run: |
          cd "$BUILD_ROOT/openwrt"
          KEY='${{ steps.host-key.outputs.HOST_CACHE_KEY }}'
          TARBALL="$HOST_CACHE_DIR/${KEY}.tzst"
          if [ ! -f "$TARBALL" ]; then
            echo "unpacked=false" >> "$GITHUB_OUTPUT"
            echo "没有现成缓存，开始编译"
            exit 0
          fi
          HOST_CACHE_KEY="$KEY" \
            bash "$GITHUB_WORKSPACE/scripts/host-toolchain.sh" unpack "$BUILD_ROOT/openwrt"

      # =========================================================
      # 9. 真编译（未命中时）
      # =========================================================
      - name: Build host Go / Rust toolchain
        id: host-build
        if: steps.host-unpack.outputs.unpacked != 'true'
        run: |
          cd "$BUILD_ROOT/openwrt"
          JOBS=$(awk -v p="$(nproc)" '/^MemAvailable:/{m=int($2/2097152)+1} END{print m<p?m:p}' /proc/meminfo)
          JOBS=$(( JOBS < 1 ? 1 : JOBS ))
          HOST_CACHE_KEY='${{ steps.host-key.outputs.HOST_CACHE_KEY }}' \
          HOST_INCLUDE_BUILDDIR="$HOST_INCLUDE_BUILDDIR" \
          JOBS="$JOBS" \
            bash "$GITHUB_WORKSPACE/scripts/host-toolchain.sh" build "$BUILD_ROOT/openwrt"

      - name: Pack host toolchain
        id: host-pack
        if: steps.host-unpack.outputs.unpacked != 'true' && steps.host-build.outputs.host_build_failed == 'false'
        run: |
          cd "$BUILD_ROOT/openwrt"
          HOST_CACHE_KEY='${{ steps.host-key.outputs.HOST_CACHE_KEY }}' \
          HOST_INCLUDE_BUILDDIR="$HOST_INCLUDE_BUILDDIR" \
            bash "$GITHUB_WORKSPACE/scripts/host-toolchain.sh" pack "$BUILD_ROOT/openwrt"

      # =========================================================
      # 10. 保存
      # =========================================================
      - name: Save host toolchain to actions/cache
        if: >-
          steps.host-pack.outputs.packed == 'true'
          || steps.host-release-restore.outputs.restored == 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: /workdir/hosttool-cache
          key: ${{ steps.host-key.outputs.HOST_CACHE_KEY }}

      - name: Save host toolchain to Release backup
        if: >-
          env.HOST_RELEASE_BACKUP == 'true'
          && steps.host-pack.outputs.packed == 'true'
          && steps.host-release-restore.outputs.restored != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEY='${{ steps.host-key.outputs.HOST_CACHE_KEY }}'
          PREFIX='${{ steps.host-key.outputs.HOST_CACHE_PREFIX }}'
          TARBALL="$HOST_CACHE_DIR/${KEY}.tzst"
          if [ ! -f "$TARBALL" ]; then
            echo "::warning::$TARBALL 不存在，跳过"
            exit 0
          fi
          SZ=$(stat -c%s "$TARBALL")
          if [ "$SZ" -lt 1024 ]; then
            echo "::warning::$TARBALL 只有 ${SZ} 字节，视为无效，跳过上传"
            exit 0
          fi

          # 清掉同前缀的旧资产（版本变了 key 就变，旧的留着没用）
          gh release view hosttool-cache --repo "$GITHUB_REPOSITORY" --json assets \
            -q '.assets[].name' 2>/dev/null | grep "^${PREFIX}" | while read -r old; do
              gh release delete-asset hosttool-cache "$old" --repo "$GITHUB_REPOSITORY" -y 2>/dev/null || true
            done

          gh release upload hosttool-cache "$TARBALL" --repo "$GITHUB_REPOSITORY" --clobber
          ls -lh "$TARBALL"

      # =========================================================
      # 11. 状态
      # =========================================================
      - name: Host toolchain status
        if: always()
        continue-on-error: true
        run: |
          cd "$BUILD_ROOT/openwrt"
          bash "$GITHUB_WORKSPACE/scripts/host-toolchain.sh" status "$BUILD_ROOT/openwrt"

      - name: Upload host toolchain report
        if: always()
        uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: host-toolchain-${{ matrix.soc }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/build-reports/
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo "### Host Toolchain Cache — ${{ matrix.soc }}"
            echo ""
            echo "- Key: \`${{ steps.host-key.outputs.HOST_CACHE_KEY }}\`"
            echo "- 缓存命中: actions/cache=${{ steps.host-restore.outputs.cache-hit || 'false' }} Release=${{ steps.host-release-restore.outputs.restored || 'false' }}"
            echo "- 本次编译: ${{ steps.host-unpack.outputs.unpacked != 'true' && '是' || '否（已命中）' }}"
            echo "- 打包成功: ${{ steps.host-pack.outputs.packed || 'n/a' }}"
          } >> "$GITHUB_STEP_SUMMARY"
