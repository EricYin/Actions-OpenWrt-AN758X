# =========================================================
# 移植片段：host 侧 Go / Rust 免编译 + 缓存
# 目标文件：.github/workflows/build-ponwrt.yml
# 参考实现：VIKINGYFY/OpenWRT-CI 的
#   .github/scripts/prepare-build-host.sh
#   .github/scripts/prepare-rust.sh
#   .github/scripts/rust-prebuilt.mk
# =========================================================

# ---------------------------------------------------------
# 【改动 1】workflow 级 env：与 USE_DL_CACHE / USE_CCACHE 并排加
#   （约第 20~23 行，USE_CCACHE: false 下面）
# ---------------------------------------------------------
env:
  USE_DL_CACHE: true
  USE_CCACHE: false
  # ★ 新增：host 侧工具链复用 runner 预装（true = 免编 go-bootstrap / rustc）
  #   关掉任何一个即回退到 feed 的源码自举，行为与改动前完全一致
  USE_HOST_GO_BOOTSTRAP: ${{ github.event.inputs.use_host_go_bootstrap || 'true' }}
  USE_HOST_RUST: ${{ github.event.inputs.use_host_rust || 'true' }}
  # true = 复用失败就硬失败；false = 打 warning 后回退源码编译（推荐）
  STRICT_HOST_RUST: 'false'
  SKIP_PYTHON_PGO: 'true'

# ---------------------------------------------------------
# 【改动 2】workflow_dispatch.inputs：可选，方便单次运行时关掉
#   注意用 choice + 'true'/'false' 字符串，别用 boolean
#   （本 workflow 可被 repository_dispatch 触发，boolean 会退化成空串）
# ---------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      use_host_go_bootstrap:
        description: 'host Go 用 runner 预装引导（关=源码自举 go-bootstrap）'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      use_host_rust:
        description: 'host Rust 用 runner 的 rustup（关=源码编译 rustc）'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

# ---------------------------------------------------------
# 【改动 3】新增步骤 A：放在「8. Set timezone to China (diy-part2.sh)」
#   之后、「9. Generate toolchain cache key」之前。
#   ⚠ 顺序关键：prepare-host-go.sh 写的是 .config 符号，
#     必须早于步骤 9 里那次唯一的 make defconfig，否则不生效。
#     （feeds 在步骤 4 已装好，脚本能找到 lang/golang。）
# ---------------------------------------------------------
      - name: Prepare host Go bootstrap
        if: env.USE_HOST_GO_BOOTSTRAP == 'true'
        run: |
          cd "$BUILD_ROOT/openwrt"
          chmod +x "$GITHUB_WORKSPACE/scripts/prepare-host-go.sh"
          SKIP_PYTHON_PGO="$SKIP_PYTHON_PGO" \
            bash "$GITHUB_WORKSPACE/scripts/prepare-host-go.sh" "$BUILD_ROOT/openwrt"

# ---------------------------------------------------------
# 【改动 4】新增步骤 B + C：放在「12. Handle toolchain」之后、
#   「12.5 Setup ccache (opt-in)」之前。
#   ⚠ 放这里的原因：
#     - 步骤 4 已装 feeds → 有 feeds/packages/lang/rust/Makefile；
#     - 工具链缓存已在步骤 10/11 恢复完 → 无论缓存里有没有 rustc，
#       脚本都能保证 host/bin 可用（缺/悬空才链，已编译的真身不覆盖）；
#     - 早于步骤 17 的 make download → rust 源码包不再被下载（PKG_SOURCE 已置空）。
# ---------------------------------------------------------
      - name: Prepare host Rust toolchain
        if: env.USE_HOST_RUST == 'true'
        run: |
          cd "$BUILD_ROOT/openwrt"
          chmod +x "$GITHUB_WORKSPACE/scripts/prepare-host-rust.sh"
          STRICT_HOST_RUST="$STRICT_HOST_RUST" \
            bash "$GITHUB_WORKSPACE/scripts/prepare-host-rust.sh" "$BUILD_ROOT/openwrt"

      - name: Verify host toolchains (post cache restore)
        continue-on-error: true
        run: |
          cd "$BUILD_ROOT/openwrt"
          dos2unix "$GITHUB_WORKSPACE/scripts/verify-host-toolchains.sh" 2>/dev/null || true
          chmod +x "$GITHUB_WORKSPACE/scripts/verify-host-toolchains.sh"
          bash "$GITHUB_WORKSPACE/scripts/verify-host-toolchains.sh" "$BUILD_ROOT/openwrt"

# ---------------------------------------------------------
# 【改动 5】可选：Release/Artifact 里带上工具链报告，便于回溯版本
#   放在「Compile the firmware」之后即可
# ---------------------------------------------------------
      - name: Upload host toolchain report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: host-toolchain-${{ env.SOC }}-${{ env.PROFILE }}-${{ github.run_attempt }}
          path: ${{ env.BUILD_ROOT }}/openwrt/build-reports/
          retention-days: 7
